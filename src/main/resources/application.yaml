spring:
  application:
    name: kabal-text-templates
  main:
    banner-mode: OFF
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-request-size: 8MB
      max-file-size: 8MB
  codec:
    max-in-memory-size: 16MB
  datasource:
    url: jdbc:postgresql://${NAIS_DATABASE_KABAL_TEXT_TEMPLATES_KABAL_TEXT_TEMPLATES_HOST}:${NAIS_DATABASE_KABAL_TEXT_TEMPLATES_KABAL_TEXT_TEMPLATES_PORT}/${NAIS_DATABASE_KABAL_TEXT_TEMPLATES_KABAL_TEXT_TEMPLATES_DATABASE}
    username: ${NAIS_DATABASE_KABAL_TEXT_TEMPLATES_KABAL_TEXT_TEMPLATES_USERNAME}
    password: ${NAIS_DATABASE_KABAL_TEXT_TEMPLATES_KABAL_TEXT_TEMPLATES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Controllers map lazy-loaded entity collections outside service transactions.
    open-in-view: true
  flyway:
    enabled: true
    clean-disabled: true
    schemas: flyway_history_schema,klage
  sql:
    init:
      platform: postgresql
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-stacktrace: never
  data:
    redis:
      host: ${REDIS_HOST_TEXTS}
      port: ${REDIS_PORT_TEXTS}
      password: ${REDIS_PASSWORD_TEXTS}
      username: ${REDIS_USERNAME_TEXTS}
      ssl:
        enabled: true

server:
  port: 7096
  error:
    whitelabel:
      enabled: false
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 5KB

management:
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false
  health:
    redis:
      enabled: false
